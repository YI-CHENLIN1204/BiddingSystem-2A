# Independent fault-injection stack. Do NOT combine with compose.yaml.
# No Supabase connection string accepted; only local isolated 'db' hostname.
name: bidding-2a-fault
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bidding_fault
      POSTGRES_USER: fault_user
      POSTGRES_PASSWORD: ${FAULT_DB_PASSWORD:?Set a disposable password for isolated testing}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault_user -d bidding_fault"]
      interval: 2s
      retries: 30
    networks: [isolated]
  backend:
    build:
      context: .
      dockerfile: 崴正/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=bidding_fault;Username=fault_user;Password=${FAULT_DB_PASSWORD:?Set a disposable password for isolated testing};SSL Mode=Disable;Pooling=false;Timeout=10;Command Timeout=15"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [isolated]
    restart: "no"
networks:
  isolated:
    internal: true
