name: 2A Research Acceptance
on:
  push:
    branches: [research/kde-comparison-20261122]
    paths:
      - '.github/workflows/2a-research-acceptance.yml'
      - 'research/acceptance-ci/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-api:
    if: github.ref == 'refs/heads/research/kde-comparison-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: research_acceptance
          POSTGRES_USER: research_fixture
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U research_fixture -d research_acceptance"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test isolated EF and HTTP workflow
        shell: bash
        env:
          RESEARCH_PORT: ${{ job.services.postgres.ports[5432] }}
        run: bash research/acceptance-ci/run-api.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-api
          path: evidence/api/
  word:
    if: github.ref == 'refs/heads/research/kde-comparison-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render approved research document
        shell: bash
        run: |
          mkdir -p evidence/word
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk poppler-utils
          source=research/2a_synthetic/output/fairness-v2/final-delivery/Factory-Fairness-Report-ZH.docx
          test -s "$source"
          sha256sum "$source" > evidence/word/source.sha256
          libreoffice "-env:UserInstallation=file://$RUNNER_TEMP/lo-profile" --headless --convert-to pdf --outdir evidence/word "$source"
          pdf=evidence/word/Factory-Fairness-Report-ZH.pdf
          test -s "$pdf"
          pdfinfo "$pdf" > evidence/word/pdfinfo.txt
          pdftoppm -r 130 -png "$pdf" evidence/word/page
          pdftotext -layout "$pdf" evidence/word/extracted.txt
          python research/acceptance-ci/inspect-pages.py
          (cd evidence/word && sha256sum *.pdf *.png *.json *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-rendered-pages
          path: evidence/word/
