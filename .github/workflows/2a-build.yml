name: 2A Build Validation
on:
  push:
    branches:
      - feature/1d-api-integration
  pull_request:
    branches:
      - main
      - feature/1d-api-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build ASP.NET Core API
        run: dotnet build "./崴正/崴正.csproj" -c Release
      - name: Verify sheet selection and price column safety
        run: dotnet run --project "./tests/WorkbookParserTests/WorkbookParserTests.csproj" -c Release

  material-dictionary-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: issue3_fixture
          POSTGRES_PASSWORD: issue3_fixture
          POSTGRES_DB: issue3_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U issue3_fixture -d issue3_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify material review and historical quantity on isolated PostgreSQL
        run: dotnet run --project ./tests/WorkbookParserTests/WorkbookParserTests.csproj -c Release -- --material-postgres

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate permanent read-only verification scripts
        run: |
          node --check scripts/verify-ui-preflight.mjs
          node --check scripts/verify-ui-state.mjs
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vue type-check and Vite build
        working-directory: frontend
        run: npm run build

  synthetic-fixture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic UI fixture generator is runnable with dependencies
        run: python -m unittest discover -s tools/graduation-synthetic -p 'test_*.py' -v
