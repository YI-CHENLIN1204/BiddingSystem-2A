name: 2A Build Validation
on:
  push:
    branches:
      - feature/1d-api-integration
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build ASP.NET Core API
        run: dotnet build "./崴正/崴正.csproj" -c Release
      - name: Verify sheet selection and price column safety
        run: dotnet run --project "./tests/WorkbookParserTests/WorkbookParserTests.csproj" -c Release --no-restore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vue type-check and Vite build
        working-directory: frontend
        run: npm run build
