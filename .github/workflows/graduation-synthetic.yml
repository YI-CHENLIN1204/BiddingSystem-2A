name: Graduation synthetic generator

on:
  push:
    paths:
      - 'tools/graduation-synthetic/**'
      - '.github/workflows/graduation-synthetic.yml'
  pull_request:
    paths:
      - 'tools/graduation-synthetic/**'
      - '.github/workflows/graduation-synthetic.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run generator and XLSX tests
        run: python -m unittest discover -s tools/graduation-synthetic -p 'test_*.py' -v
      - name: Generate offline demonstration data and workbook
        run: |
          python tools/graduation-synthetic/generate.py --count 300 --seed 20261119 --output /tmp/graduation-data
          python tools/graduation-synthetic/export_demo_excel.py --source /tmp/graduation-data --output /tmp/graduation-demo.xlsx
          test -s /tmp/graduation-demo.xlsx
          python tools/graduation-synthetic/generate_irregular_excel.py --source /tmp/graduation-data --output /tmp/graduation-irregular.xlsx --truth /tmp/graduation-irregular-truth.json
          test -s /tmp/graduation-irregular.xlsx
          test -s /tmp/graduation-irregular-truth.json
          python tools/graduation-synthetic/generate_full_project_dataset.py --count 60 --seed 20261119 --output /tmp/graduation-full
          python tools/graduation-synthetic/export_full_project_excel.py --source /tmp/graduation-full --output /tmp/graduation-full.xlsx --truth /tmp/graduation-full-truth.json
          python tools/graduation-synthetic/evaluate_full_project_holdout.py --source /tmp/graduation-full --output /tmp/graduation-full-evaluation.json
          python tools/graduation-synthetic/build_evidence_report.py --source /tmp/graduation-full --benchmark /tmp/graduation-full-evaluation.json --output /tmp/graduation-evidence.html
          test -s /tmp/graduation-evidence.html
          test -s /tmp/graduation-full.xlsx
          test -s /tmp/graduation-full-truth.json
          test -s /tmp/graduation-full-evaluation.json
