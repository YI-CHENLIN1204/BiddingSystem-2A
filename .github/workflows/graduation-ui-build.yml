name: Graduation UI build and preflight syntax
on:
  push:
    branches:
      - main
      - feature/1d-api-integration
    paths:
      - "frontend/**"
      - "scripts/verify-ui-preflight.mjs"
      - ".github/workflows/graduation-ui-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/verify-ui-preflight.mjs"
      - ".github/workflows/graduation-ui-build.yml"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate preflight syntax without touching database
        run: node --check scripts/verify-ui-preflight.mjs
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Vue typecheck and production build
        working-directory: frontend
        run: npm run build
