name: 2A Integration POC CI

on:
  push:
    branches:
      - feature/1d-detection-integration
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore "./崴正/崴正.csproj"

      - name: Build backend
        run: dotnet build "./崴正/崴正.csproj" -c Release --no-restore

      - name: Run detection category smoke test
        run: dotnet run --project "./tools/DetectionCategorySmokeTest/DetectionCategorySmokeTest.csproj" -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build
        env:
          DB_CONNECTION_STRING: "Host=example.invalid;Port=5432;Database=postgres;Username=postgres;Password=placeholder;SSL Mode=Require"
          ONE_D_API_BASE_URL: ""
