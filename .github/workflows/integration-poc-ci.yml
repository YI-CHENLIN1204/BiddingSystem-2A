name: 2A Integration POC CI

on:
  push:
    branches:
      - feature/1d-detection-integration
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore "./崴正/崴正.csproj"

      - name: Build backend
        run: dotnet build "./崴正/崴正.csproj" -c Release --no-restore

      - name: Run project-wide detection smoke test
        run: dotnet run --project "./tools/DetectionCategorySmokeTest/DetectionCategorySmokeTest.csproj" -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build
        env:
          DB_CONNECTION_STRING: "Host=example.invalid;Port=5432;Database=postgres;Username=postgres;Password=placeholder;SSL Mode=Require"
          ONE_D_API_BASE_URL: ""

      - name: Run Docker project preview smoke test
        shell: bash
        env:
          DB_CONNECTION_STRING: "Host=example.invalid;Port=5432;Database=postgres;Username=postgres;Password=placeholder;SSL Mode=Require"
          ONE_D_API_BASE_URL: ""
        run: |
          set -euo pipefail

          docker compose up -d

          cleanup() {
            docker compose logs --no-color || true
            docker compose down -v || true
          }
          trap cleanup EXIT

          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8081/api/system/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Docker services did not become ready in time."
              exit 1
            fi
            sleep 2
          done

          echo "Health check:"
          curl --fail --silent http://127.0.0.1:8081/api/system/health
          echo

          echo "Project-wide detection preview:"
          curl --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "items": [
                {"chapter":"假設工程","name":"臨時水電及施工設施","unit":"式","quantity":1},
                {"chapter":"土方及基礎工程","name":"地下室土方開挖","unit":"M3","quantity":8200},
                {"chapter":"結構體工程","name":"SD420W高拉力鋼筋#4以上","unit":"KG","quantity":100000},
                {"chapter":"結構體工程","name":"SD420W高拉力鋼筋#3以下","unit":"KG","quantity":40000},
                {"chapter":"結構體工程","name":"預拌混凝土 3500psi","unit":"M3","quantity":3200},
                {"chapter":"結構體工程","name":"結構體模板","unit":"M2","quantity":26000},
                {"chapter":"結構體工程","name":"SD420W鋼筋續接器","unit":"個","quantity":780},
                {"chapter":"鋼骨鋼構工程","name":"H型鋼鋼柱","unit":"T","quantity":850},
                {"chapter":"防水工程","name":"屋頂防水層","unit":"M2","quantity":1800},
                {"chapter":"門窗工程","name":"鋁門窗","unit":"樘","quantity":126},
                {"chapter":"景觀工程","name":"景觀植栽","unit":"式","quantity":1}
              ]
            }' \
            http://127.0.0.1:8081/api/one-d/detection-preview
          echo
