name: Temporary Detection Range Build

on:
  push:
    branches:
      - feature/1d-api-integration

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore "崴正/崴正.csproj"
      - name: Build
        run: dotnet build "崴正/崴正.csproj" --configuration Release --no-restore
